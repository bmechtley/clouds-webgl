<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <style>
      html, body { height: 100%; margin: 0; }
      #c { width: 100%; height: 100%; display: block; cursor: crosshair; }
    </style>
  </head>

  <body>
    <canvas id="c"></canvas>
  </body>

  <script type="module">
    import * as THREE from 'three';
    import * as DAT from 'dat.gui';
    import Simulation from './src/simulation.js';
    import Stats from 'stats.js';
    import {
      build_gui_params_and_uniforms, build_gui_controllers,
      parameters, controllers, presets, guiparams, uniforms
    } from './src/gui.js';

    const canvas = document.querySelector('#c');
    const renderer = new THREE.WebGLRenderer({ canvas });
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);

    const gui = new DAT.GUI();

    build_gui_params_and_uniforms();

    // Run simulation at window resolution so dim matches render targets (shaderop uses window size).
    uniforms.simulation.dim.value.set(window.innerWidth, window.innerHeight);

    uniforms.simulation.time = { value: 0 };

    // Preset selector — shown at the top of the panel before other controls.
    const presetNames = Object.keys(presets.remembered);
    const presetState = { preset: presetNames[0] };
    gui.add(presetState, 'preset', presetNames).onChange(name => {
      const p = presets.remembered[name]?.['0'];
      if (!p) return;
      // Apply all preset values to guiparams/uniforms in-place, skipping dim
      // (managed externally at window resolution).
      function apply(src, gp, uni) {
        Object.keys(src).forEach(k => {
          if (!Object.prototype.hasOwnProperty.call(gp, k)) return;
          if (k === 'dim') return;
          const val = src[k], gpv = gp[k];
          if (Array.isArray(val)) {
            if (gpv && typeof gpv.fromArray === 'function') gpv.fromArray(val);
          } else if (val !== null && typeof val === 'object') {
            apply(val, gpv, uni?.[k]);
          } else {
            gp[k] = val;
            if (uni?.[k]) uni[k].value = val;
          }
        });
      }
      apply(p, guiparams, uniforms);
      // Refresh all dat.gui controllers recursively.
      (function refresh(folder) {
        folder.__controllers.forEach(c => c.updateDisplay());
        Object.values(folder.__folders || {}).forEach(refresh);
      })(gui);
    });

    build_gui_controllers(parameters, guiparams, uniforms, controllers, gui);

    const stats = new Stats();
    stats.setMode(0);
    stats.domElement.style.position = 'absolute';
    stats.domElement.style.left = '0';
    stats.domElement.style.top = '0';
    document.body.appendChild(stats.domElement);

    const sim = new Simulation(renderer, camera, stats);
    sim.start();

    // Mouse interaction — drag to paint vapor/density.
    canvas.addEventListener('mousemove', e => {
      sim.update_mouse(e.clientX, e.clientY, null, 0);
    });
    canvas.addEventListener('mousedown', e => {
      sim.mice[0].down = true;
      sim.update_mouse(e.clientX, e.clientY, null, 0);
    });
    canvas.addEventListener('mouseup', () => { sim.mice[0].down = false; });
    canvas.addEventListener('mouseleave', () => { sim.mice[0].down = false; });

    // Resize: update renderer, dim, and all render targets.
    window.addEventListener('resize', () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      uniforms.simulation.dim.value.set(w, h);
      Object.values(sim.shaders).forEach(s => s.resize(w, h));
    });
  </script>
</html>
